<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OurBGG</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
  header { padding: 12px 16px; background: #2b2f38; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .header-title { display: grid; gap: 4px; }
  header h1 { margin: 0; font-size: 18px; }
  .view-select { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .view-toggle { display: flex; align-items: flex-end; gap: 12px; font-size: 13px; }
  .view-toggle label { font-weight: 600; }
  .view-select select { padding: 6px 10px; border-radius: 4px; border: 1px solid #d0d7de; font-size: 13px; }
  .thumbnail-toggle { display: inline-flex; align-items: center; gap: 5px; color: #fff; cursor: pointer; }
  .thumbnail-toggle input { width: 16px; height: 16px; margin: 0; accent-color: #fff; }
  .header-filter { position: relative; display: grid; gap: 4px; min-width: 150px; }
  .header-filter-title { color: #fff; font-size: 12px; font-weight: 600; }
  .header-filter-button {
    display: flex;
    width: 100%;
    min-height: 30px;
    box-sizing: border-box;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    border: 1px solid #d0d7de;
    border-radius: 3px;
    color: #111;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
  }
  .header-filter-button::after { content: '\25bc'; color: #555; font-size: 10px; }
  .header-filter-button.active { border-color: #75a7df; }
  .header-filter-menu {
    position: absolute;
    top: 100%;
    right: 0;
    z-index: 5;
    display: grid;
    width: 240px;
    max-height: 310px;
    gap: 6px;
    overflow: auto;
    margin-top: 3px;
    padding: 8px;
    border: 1px solid #c9c9c9;
    color: #666;
    background: #fff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .2);
    font-size: 14px;
  }
  .header-filter-menu[hidden] { display: none; }
  .header-filter-search { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #aaa; font-size: 14px; }
  .header-filter-option { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .header-filter-option input { width: 16px; height: 16px; margin: 0; accent-color: #3778c9; }
  .header-filter-select-all { padding-bottom: 5px; border-bottom: 1px solid #ddd; }
  #status { padding: 8px 16px; font-size: 13px; color: #444; }
  body.collection-view { background: #fff; }
  body.collection-view > header { background: #403b68; min-height: 42px; box-sizing: border-box; padding: 7px 16px; }
  body.collection-view > header h1,
  body.collection-view > header .view-toggle label { color: #fff; }
  body.collection-view > header h1 { font-size: 16px; }
  body.collection-view > header .view-select select { padding: 4px 8px; }
  body.collection-view #status {
    box-sizing: border-box;
    margin: 0 0 4px;
    padding: 8px 16px;
    min-height: 34px;
    background: #403b68;
    color: #fff;
    font-size: 16px;
    text-align: right;
  }
  .view-collection-table thead th {
    background: #fff;
    color: #075bbb;
    border-color: #cfd4da;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    white-space: normal;
    line-height: 1.15;
    padding: 7px 8px;
  }
  .view-collection-table tbody td {
    height: 108px;
    box-sizing: border-box;
    padding: 12px 8px;
    vertical-align: top;
    background: #fff;
    color: #111;
    border-color: #cfd4da;
    font-size: 18px;
  }
  .view-collection-table tbody tr:nth-child(even) td { background: #fff; }
  .view-collection-table tbody td.title-cell {
    color: #075bbb;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 500;
    white-space: normal;
    cursor: pointer;
  }
  .view-collection-table tbody td.title-cell:hover,
  .view-collection-table tbody td.title-cell:focus { text-decoration: underline; }
  td.dialog-trigger { color: #075bbb; cursor: pointer; }
  td.dialog-trigger:hover, td.dialog-trigger:focus { text-decoration: underline; }
  .bgg-id-link { color: #075bbb; }
  .view-collection-table tbody td.rating-cell,
  .view-collection-table tbody td.status-cell,
  .view-collection-table tbody td.plays-cell { text-align: center; }
  .view-collection-table tbody td.status-cell { font-weight: 400; }
  .view-collection-table tbody td.in-collection-cell { white-space: normal; line-height: 1.3; }
  .view-collection-table tbody td.status-cell.owned { color: #111; }
  .view-collection-table tbody td.status-cell.prev-owned { color: #14149b; }
  .view-collection-table tbody td.comment-cell {
    white-space: pre-line;
    min-width: 360px;
    font-size: 18px;
    line-height: 1.3;
  }
  #status.error { color: #b00020; font-weight: bold; }
  .table-wrap { overflow: auto; max-height: calc(100vh - 90px); margin: 0 16px 16px; border: 1px solid #ccc; }
  body.collection-view .table-wrap { margin: 0 30px 16px; border: 0; }
  table { border-collapse: collapse; font-size: 12px; white-space: nowrap; table-layout: fixed; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; overflow: hidden; text-overflow: ellipsis; }
  thead th { position: sticky; top: 0; background: #2b2f38; color: #fff; z-index: 2; }
  tbody tr:nth-child(even) { background: #fafafa; }
  tbody tr:hover { background: #eef6ff; }
  td.wrap { white-space: normal; max-width: 320px; }
  th { position: relative; }
  .col-resizer { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; user-select: none; touch-action: none; }
  .col-resizer:hover, .col-resizer.resizing { background: #5b9dd9; }
  .col-label { cursor: pointer; }
  .col-label::after { content: ''; display: inline-block; width: 10px; }
  th.sort-asc .col-label::after { content: '\25b2'; }
  th.sort-desc .col-label::after { content: '\25bc'; }
  .status-filter-button {
    display: inline-flex;
    width: 28px;
    height: 22px;
    margin-left: 5px;
    padding: 0;
    align-items: center;
    justify-content: center;
    place-items: center;
    border: 1px solid #075bbb;
    border-radius: 3px;
    color: #075bbb;
    background: #fff;
    cursor: pointer;
    vertical-align: middle;
  }
  .status-filter-button::before {
    content: '';
    width: 14px;
    height: 14px;
    background: currentColor;
    clip-path: polygon(0 0, 100% 0, 63% 47%, 63% 75%, 37% 100%, 37% 47%);
  }
  .status-filter-button.active { color: #fff; background: #075bbb; }
  .status-filter-header { overflow: visible; }
  .status-filter-menu {
    position: absolute;
    top: calc(100% - 1px);
    right: 4px;
    z-index: 4;
    display: grid;
    min-width: 170px;
    gap: 6px;
    padding: 10px;
    border: 1px solid #b7c0cc;
    border-radius: 3px;
    color: #111;
    background: #fff;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
    font-size: 14px;
    font-weight: 400;
    text-align: left;
  }
  .status-filter-menu[hidden] { display: none; }
  .status-filter-option { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .status-filter-option input { margin: 0; }
  #filterRow th { top: 27px; padding: 2px 4px; }
  #filterRow input { width: 100%; box-sizing: border-box; font-size: 12px; padding: 2px 4px; }
  body.collection-view #filterRow { display: none; }
  body.collection-view .view-collection-table { table-layout: fixed; }
  body.collection-view:not(.thumbnail-view) .view-collection-table col:nth-child(1) { width: 225px !important; }
  body.collection-view:not(.thumbnail-view) .view-collection-table col:nth-child(2) { width: 102px !important; }
  body.collection-view:not(.thumbnail-view) .view-collection-table col:nth-child(3) { width: 94px !important; }
  body.collection-view:not(.thumbnail-view) .view-collection-table col:nth-child(4) { width: 190px !important; }
  body.collection-view:not(.thumbnail-view) .view-collection-table col:nth-child(5) { width: 180px !important; }
  body.collection-view:not(.thumbnail-view) .view-collection-table col:nth-child(6) { width: 96px !important; }
  body.collection-view:not(.thumbnail-view) .view-collection-table col:nth-child(7) { width: 96px !important; }
  body.collection-view:not(.thumbnail-view) .view-collection-table col:nth-child(8) { width: 390px !important; }
  body.collection-view.thumbnail-view .view-collection-table col:nth-child(1) { width: 125px !important; }
  body.collection-view.thumbnail-view .view-collection-table col:nth-child(2) { width: 225px !important; }
  body.collection-view.thumbnail-view .view-collection-table col:nth-child(3) { width: 102px !important; }
  body.collection-view.thumbnail-view .view-collection-table col:nth-child(4) { width: 94px !important; }
  body.collection-view.thumbnail-view .view-collection-table col:nth-child(5) { width: 180px !important; }
  body.collection-view.thumbnail-view .view-collection-table col:nth-child(6) { width: 190px !important; }
  body.collection-view.thumbnail-view .view-collection-table col:nth-child(7) { width: 96px !important; }
  body.collection-view.thumbnail-view .view-collection-table col:nth-child(8) { width: 96px !important; }
  body.collection-view.thumbnail-view .view-collection-table col:nth-child(9) { width: 390px !important; }
  .thumbnail-cell { padding: 8px !important; text-align: center; vertical-align: middle !important; }
  .collection-thumbnail { display: block; width: 100px; height: 120px; margin: 0 auto; object-fit: cover; }
  #gameDialog {
    width: min(1100px, calc(100vw - 48px));
    max-width: 1100px;
    padding: 0;
    border: 0;
    color: #f7f7fb;
    background: #08080e;
    box-shadow: 0 24px 80px rgba(0, 0, 0, .65);
  }
  #gameDialog::backdrop { background: rgba(1, 1, 6, .82); }
  .game-dialog-shell {
    position: relative;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 52px;
    min-height: 620px;
    padding: 22px 28px 28px;
    overflow: hidden;
    background: #08080e;
  }
  .game-dialog-shell::before {
    content: '';
    position: absolute;
    inset: 0 0 0 35%;
    background: linear-gradient(90deg, #08080e 0%, rgba(8, 8, 14, .88) 25%, rgba(8, 8, 14, .48) 100%);
    pointer-events: none;
  }
  .game-cover-panel,
  .game-dialog-content { position: relative; z-index: 1; }
  .game-cover-panel { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .game-cover {
    display: block;
    width: 310px;
    max-width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #20202b;
  }
  .collection-badge {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 18px;
    border: 0;
    border-radius: 7px;
    color: #111;
    background: #f4f4f6;
    font-size: 20px;
    font-weight: 700;
    text-align: left;
  }
  .collection-badge::before { content: '\2713'; margin-right: 8px; color: #27c982; }
  .game-dialog-content { padding-top: 5px; }
  .dialog-close {
    position: absolute;
    top: 8px;
    right: 12px;
    z-index: 2;
    border: 0;
    color: #fff;
    background: transparent;
    font-size: 32px;
    line-height: 1;
    cursor: pointer;
  }
  .game-ranks { display: flex; gap: 24px; margin: 0 0 42px; color: #f3f3f7; font-size: 18px; }
  .game-ranks span:first-child::first-letter { color: #ff5a18; }
  .game-ranks strong { margin-left: 5px; border-bottom: 1px dotted #aaa; font-weight: 400; }
  .game-title-row { display: flex; align-items: center; gap: 24px; }
  .game-rating-stack { display: flex; flex: 0 0 84px; flex-direction: column; align-items: center; gap: 5px; }
  .game-rating-badge {
    display: grid;
    width: 84px;
    height: 84px;
    place-items: center;
    color: #fff;
    background: #536cae;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    font-size: 31px;
    font-weight: 700;
  }
  .game-geek-rating-label { color: #ddd; font-size: 13px; font-weight: 700; }
  .game-geek-rating-value { color: #fff; font-size: 16px; }
  .game-title-row h2 { margin: 0; color: #fff; font-size: clamp(24px, 3vw, 38px); line-height: 1.15; }
  .game-year { margin: 12px 0 12px 110px; font-size: 26px; font-weight: 700; }
  .game-description { margin: 0 0 28px 110px; font-size: 23px; line-height: 1.35; }
  .game-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin: 0 0 22px;
    border-top: 1px solid #30303a;
    border-bottom: 1px solid #30303a;
  }
  .game-stat { min-width: 0; padding: 18px 14px 16px 0; border-right: 1px solid #30303a; }
  .game-stat + .game-stat { padding-left: 18px; }
  .game-stat:last-child { border-right: 0; }
  .game-stat strong { display: block; font-size: 24px; }
  .game-stat span { display: block; margin-top: 8px; color: #ddd; font-size: 16px; }
  .game-stat em { color: #2bd485; font-style: normal; }
  .game-metadata { display: grid; gap: 12px; color: #eee; font-size: 19px; line-height: 1.35; }
  .game-metadata strong { margin-right: 8px; }
  .dialog-play-button { margin-top: 22px; padding: 10px 18px; border: 0; border-radius: 6px; font-size: 18px; font-weight: 700; cursor: pointer; }
  @media (max-width: 760px) {
    .game-dialog-shell { grid-template-columns: 1fr; gap: 22px; min-height: 0; padding: 18px; }
    .game-cover-panel { align-items: stretch; }
    .game-cover { width: min(240px, 70vw); margin: 0 auto; }
    .game-ranks { flex-wrap: wrap; margin-bottom: 22px; }
    .game-title-row { align-items: flex-start; gap: 12px; }
    .game-rating-stack { flex-basis: 66px; }
    .game-rating-badge { width: 66px; height: 66px; font-size: 24px; }
    .game-title-row h2 { font-size: 26px; }
    .game-year, .game-description { margin-left: 78px; }
    .game-description { font-size: 18px; }
    .game-stats { grid-template-columns: repeat(2, 1fr); }
    .game-stat:nth-child(2) { border-right: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="header-title">
    <h1>Our BGG Collection</h1>
    <div class="view-select">
      <label for="viewSelect">View</label>
      <select id="viewSelect" aria-label="View">
        <option value="collection" selected>Collection View</option>
        <option value="detailed">Detailed View</option>
      </select>
    </div>
  </div>
  <div class="view-toggle">
    <div class="header-filter" id="statusFilterControl"></div>
    <div class="header-filter" id="collectionFilterControl"></div>
    <label class="thumbnail-toggle" for="thumbnailToggle">
      <input id="thumbnailToggle" type="checkbox" aria-label="Thumbnail" checked>
      Thumbnail
    </label>
  </div>
</header>
<div id="status">Loading data from collection.csv&hellip;</div>
<div class="table-wrap">
  <table id="gameTable">
    <colgroup id="colGroup"></colgroup>
    <thead>
      <tr id="headerRow"></tr>
      <tr id="filterRow"></tr>
    </thead>
    <tbody id="bodyRows"></tbody>
  </table>
</div>
<dialog id="gameDialog" aria-labelledby="dialogGameTitle">
  <div class="game-dialog-shell">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="Close game details">&times;</button>
    <div class="game-cover-panel">
      <img class="game-cover" id="dialogCover" alt="">
      <div class="collection-badge" id="dialogCollectionStatus">In Collection</div>
      <button class="dialog-play-button" type="button" id="dialogPlayButton">Log Play</button>
    </div>
    <div class="game-dialog-content">
      <div class="game-ranks">
        <span>&#9819; RANK: OVERALL <strong id="dialogOverallRank">N/A</strong></span>
        <span>FAMILY <strong id="dialogFamilyRank">N/A</strong></span>
      </div>
      <div class="game-title-row">
        <div class="game-rating-stack">
          <div class="game-rating-badge" id="dialogRating">N/A</div>
          <div class="game-geek-rating-label">Geek Rating</div>
          <div class="game-geek-rating-value" id="dialogGeekRating">N/A</div>
        </div>
        <h2 id="dialogGameTitle"></h2>
      </div>
      <div class="game-year" id="dialogYear"></div>
      <p class="game-description" id="dialogDescription"></p>
      <div class="game-stats">
        <div class="game-stat"><strong id="dialogPlayers">N/A</strong><span>Players</span></div>
        <div class="game-stat"><strong id="dialogPlayTime">N/A</strong><span>Playing Time</span></div>
        <div class="game-stat"><strong id="dialogAge">N/A</strong><span>Age</span></div>
        <div class="game-stat"><strong><em id="dialogWeight">N/A</em> / 5</strong><span>Complexity Rating</span></div>
      </div>
      <div class="game-metadata">
        <div><strong>Collection:</strong> <span id="dialogStatus"></span></div>
        <div><strong>Your Rating:</strong> <span id="dialogYourRating"></span></div>
        <div><strong>Your Plays:</strong> <span id="dialogYourPlays"></span></div>
      </div>
    </div>
  </div>
</dialog>

<script>
// Column list mirrors every column (A-AO) of the "Games" sheet in Games.xlsx, in order.
// field = matching key in the CSV data, or null when the CSV has no equivalent data (rendered blank).
const COLUMNS = [
  { header: 'Name',           field: 'game_name' },
  { header: 'Rating',         field: 'average_rating' },
  { header: 'Complex',        field: 'weight' },
  { header: 'Yr',             field: 'year_published' },
  { header: 'YrAquired',      field: null },
  { header: 'MAquired',       field: null },
  { header: 'Played?',        field: null },
  { header: 'P-',             field: 'min_players' },
  { header: 'P+',             field: 'max_players' },
  { header: 'Ages',           field: 'min_age' },
  { header: 'Tmin',           field: 'playing_time_min' },
  { header: 'Tmax',           field: 'playing_time_max' },
  { header: 'bggSTAT',        field: null },
  { header: 'bgg-ID',         field: 'bgg_id' },
  { header: 'RecG',           field: null },
  { header: 'TYPE',           field: null },
  { header: 'Category',       field: 'categories' },
  { header: 'Mechanism',      field: 'mechanics' },
  { header: 'complexrange',   field: null },
  { header: 'Min Age Range',  field: null },
  { header: 'Game_Type',      field: null },
  { header: '1',              field: null },
  { header: '5',              field: null },
  { header: '9',              field: null },
  { header: '13',             field: null },
  { header: 'category',       field: null },
  { header: '1',              field: null },
  { header: '5',              field: null },
  { header: '9',              field: null },
  { header: '13',             field: null },
  { header: '17',             field: null },
  { header: '21',             field: null },
  { header: 'mechanic',       field: null },
  { header: '1',              field: null },
  { header: '5',              field: null },
  { header: '9',              field: null },
  { header: '13',             field: null },
  { header: '17',             field: null },
  { header: '21',             field: null },
  { header: '25',             field: null }
];

const BGG_COLUMNS = [
  { header: 'Name',      field: 'game_name' },
  { header: 'Rating',    field: 'average_rating' },
  { header: 'Complex',   field: 'weight' },
  { header: 'Yr',        field: 'year_published' },
  { header: 'P-',        field: 'min_players' },
  { header: 'P+',        field: 'max_players' },
  { header: 'Ages',      field: 'min_age' },
  { header: 'Tmin',      field: 'playing_time_min' },
  { header: 'Tmax',      field: 'playing_time_max' },
  { header: 'bgg-ID',    field: 'bgg_id' },
  { header: 'Category',  field: 'categories' },
  { header: 'Mechanism', field: 'mechanics' }
];

const COLLECTION_COLUMNS = [
  { header: 'Title',        field: 'game_name' },
  { header: 'Geek Rating',  field: 'bgg_rating' },
  { header: 'Status',       field: 'status' },
  { header: 'In Collection', field: 'in_collection' },
  { header: 'Min Players',  field: 'min_players' },
  { header: 'Max Players',  field: 'max_players' },
  { header: 'Comment',      field: 'comment' }
];

const ADDITIONAL_COLUMNS = [];
const THUMBNAIL_COLUMN = { header: '', field: 'collectiondetails2026.thumbnail' };
const VALUE3_FIELD = 'collectiondetails2026.value3';
const RANK_ID_FIELD = 'boardgames_ranks.id';

let activeView = 'collection';
let thumbnailEnabled = true;
let selectedStatusValues = new Set(['Owned']);
let selectedCollectionValues = null;
const COLLECTION_FLAGS = ['own', 'fortrade', 'want', 'wanttobuy', 'wanttoplay', 'prevowned', 'preordered', 'wishlist'];
const WRAP_FIELDS = new Set(['description', 'categories', 'mechanics', 'alternate_names', 'families', 'publishers']);

function getActiveColumns() {
  const columns = activeView === 'collection' ? COLLECTION_COLUMNS : COLUMNS;
  const activeColumns = columns.concat(ADDITIONAL_COLUMNS);
  if (activeView !== 'collection') {
    return thumbnailEnabled ? [THUMBNAIL_COLUMN, ...activeColumns] : activeColumns;
  }
  const value3Column = ADDITIONAL_COLUMNS.find(column => column.field === VALUE3_FIELD);
  const averageRatingColumn = value3Column
    ? { ...value3Column, header: 'Average Rating' }
    : null;
  const collectionColumns = value3Column
    ? [COLLECTION_COLUMNS[0], averageRatingColumn, ...COLLECTION_COLUMNS.slice(1)]
    : COLLECTION_COLUMNS;
  return thumbnailEnabled ? [THUMBNAIL_COLUMN, ...collectionColumns] : collectionColumns;
}

function toNumber(value) {
  if (value === null || value === undefined || value === '') return null;
  const num = Number(String(value).replace(/[^0-9.-]/g, ''));
  return Number.isFinite(num) ? num : null;
}

function parseAge(value) {
  if (value === null || value === undefined || value === '') return null;
  const match = String(value).match(/\d+/);
  return match ? Number(match[0]) : null;
}

function parseCSV(text) {
  const rows = [];
  let currentRow = [];
  let currentValue = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (char === '"') {
      if (inQuotes && text[i + 1] === '"') {
        currentValue += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
      continue;
    }

    if (char === ',' && !inQuotes) {
      currentRow.push(currentValue);
      currentValue = '';
      continue;
    }

    if ((char === '\n' || char === '\r') && !inQuotes) {
      if (char === '\r' && text[i + 1] === '\n') {
        i++;
      }
      currentRow.push(currentValue);
      if (currentRow.some(value => value !== '')) {
        rows.push(currentRow);
      }
      currentRow = [];
      currentValue = '';
      continue;
    }

    currentValue += char;
  }

  if (currentValue.length > 0 || currentRow.length > 0) {
    currentRow.push(currentValue);
    if (currentRow.some(value => value !== '')) {
      rows.push(currentRow);
    }
  }

  if (rows.length === 0) return [];

  const [header, ...dataRows] = rows;
  return dataRows.map(row => {
    const entry = {};
    header.forEach((key, index) => {
      const value = row[index] ?? '';
      entry[key.trim()] = value.trim();
    });
    return entry;
  });
}

function getStatus(row) {
  if (row.own === '1') return 'Owned';
  if (row.prevowned === '1') return 'Prev. Owned';
  if (row.wanttoplay === '1') return 'Want to Play';
  if (row.want === '1') return 'Want';
  if (row.wishlist === '1') return 'Wishlist';
  if (row.fortrade === '1') return 'For Trade';
  return '';
}

function getCollectionValues(row) {
  return COLLECTION_FLAGS.filter(flag => row[flag] === '1');
}

function normalizeCsvRow(row) {
  const status = getStatus(row);
  const inCollection = getCollectionValues(row);
  const comment = row.comment || row.privatecomment || '';
  const normalized = {
    game_name: row.objectname || row.originalname || '',
    average_rating: toNumber(row.average),
    weight: toNumber(row.avgweight),
    year_published: toNumber(row.yearpublished),
    min_players: toNumber(row.minplayers),
    max_players: toNumber(row.maxplayers),
    min_age: parseAge(row.bggrecagerange),
    playing_time_min: toNumber(row.minplaytime),
    playing_time_max: toNumber(row.maxplaytime),
    bgg_id: toNumber(row.objectid),
    bgg_rating: toNumber(row.baverage),
    rating: toNumber(row.rating),
    numplays: toNumber(row.numplays),
    status,
    in_collection: inCollection,
    comment,
    categories: '',
    mechanics: '',
    description: ''
  };
  Object.keys(row).forEach(field => {
    if (field.includes('.')) normalized[field] = row[field];
  });
  return normalized;
}

function loadCsvFile(filename) {
  return fetch(filename)
    .then(response => {
      if (!response.ok) {
        throw new Error(filename + ' could not be loaded (HTTP ' + response.status + ')');
      }
      return response.text();
    })
    .then(csvText => {
      const rows = parseCSV(csvText);
      if (!rows.length) throw new Error(filename + ' is empty or invalid.');
      return rows;
    });
}

function addJoinedColumns(collectionRows, sourceRows, sourceName, sourceKey) {
  const sourceFields = Object.keys(sourceRows[0] || {});
  sourceFields.forEach(field => {
    ADDITIONAL_COLUMNS.push({
      header: sourceName + '.' + field,
      field: sourceName + '.' + field
    });
  });

  const sourceByKey = new Map(sourceRows.map(row => [String(row[sourceKey] ?? '').trim(), row]));
  return collectionRows.map(row => {
    const sourceRow = sourceByKey.get(String(row.objectid ?? '').trim());
    const joinedRow = { ...row };
    sourceFields.forEach(field => {
      joinedRow[sourceName + '.' + field] = sourceRow?.[field] ?? '';
    });
    return joinedRow;
  });
}

function buildColGroup(columns = getActiveColumns()) {
  const colGroup = document.getElementById('colGroup');
  colGroup.innerHTML = '';
  const frag = document.createDocumentFragment();
  const collectionWidths = activeView === 'collection'
    ? thumbnailEnabled
      ? [125, 225, 102, 94, 180, 190, 96, 96, 390]
      : [225, 102, 94, 180, 190, 96, 96, 390]
    : thumbnailEnabled ? [125] : [];
  columns.forEach((_, index) => {
    const col = document.createElement('col');
    col.style.width = activeView === 'collection'
      ? (collectionWidths[index] ?? 120) + 'px'
      : '120px';
    frag.appendChild(col);
  });
  colGroup.appendChild(frag);
  updateTableWidth();
}

// Chrome only honors <col> widths under table-layout:fixed when the table itself has
// an explicit (non-auto) width, so keep the table's width in sync with the column sum.
function updateTableWidth() {
  const colGroup = document.getElementById('colGroup');
  const total = Array.from(colGroup.children)
    .reduce((sum, col) => sum + parseFloat(col.style.width || '120'), 0);
  document.querySelector('table').style.width = total + 'px';
}

function buildHeader() {
  const columns = getActiveColumns();
  document.body.classList.toggle('thumbnail-view', thumbnailEnabled && activeView === 'collection');
  buildColGroup(columns);
  const row = document.getElementById('headerRow');
  row.innerHTML = '';
  const frag = document.createDocumentFragment();
  columns.forEach((col, index) => {
    const th = document.createElement('th');
    th.dataset.colIndex = index;
    const label = document.createElement('span');
    label.className = 'col-label';
    label.textContent = col.header;
    label.addEventListener('click', () => sortByColumn(index));
    th.appendChild(label);
    const resizer = document.createElement('div');
    resizer.className = 'col-resizer';
    th.appendChild(resizer);
    frag.appendChild(th);
  });
  row.appendChild(frag);
  enableColumnResize(row);
  buildFilterRow();
}

let allGames = [];
const sortState = { colIndex: null, dir: 1 };
const filters = {};

function buildFilterMenu(field, title, filterButton) {
  const menu = document.createElement('div');
  menu.className = 'header-filter-menu';
  menu.hidden = true;
  menu.addEventListener('click', event => event.stopPropagation());
  const values = field === 'status'
    ? [...new Set(allGames.map(game => game.status).filter(Boolean))].sort()
    : [...new Set(allGames.flatMap(game => game.in_collection))].sort();
  const selectedValues = field === 'status' ? selectedStatusValues : selectedCollectionValues;

  const search = document.createElement('input');
  search.className = 'header-filter-search';
  search.type = 'search';
  search.placeholder = 'Find';
  search.setAttribute('aria-label', `Find ${title}`);
  menu.appendChild(search);

  const options = document.createElement('div');
  const selectAll = document.createElement('label');
  selectAll.className = 'header-filter-option header-filter-select-all';
  const selectAllInput = document.createElement('input');
  selectAllInput.type = 'checkbox';
  selectAllInput.checked = selectedValues === null;
  selectAll.appendChild(selectAllInput);
  selectAll.append('Select All');
  options.appendChild(selectAll);

  const checkboxes = [];
  values.forEach(value => {
    const option = document.createElement('label');
    option.className = 'header-filter-option';
    option.dataset.value = value.toLowerCase();
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.value = value;
    checkbox.checked = selectedValues === null || selectedValues.has(value);
    option.appendChild(checkbox);
    option.append(value);
    options.appendChild(option);
    checkboxes.push(checkbox);
  });
  menu.appendChild(options);

  function updateSelection() {
    const selected = new Set(checkboxes.filter(input => input.checked).map(input => input.value));
    const nextValues = selected.size === values.length ? null : selected;
    if (field === 'status') selectedStatusValues = nextValues;
    else selectedCollectionValues = nextValues;
    selectAllInput.checked = nextValues === null;
    filterButton.classList.toggle('active', nextValues !== null);
    filterButton.textContent = nextValues === null
      ? `All ${values.length} selected`
      : `${selected.size} of ${values.length} selected`;
    render();
  }

  selectAllInput.addEventListener('change', () => {
    checkboxes.forEach(input => { input.checked = selectAllInput.checked; });
    updateSelection();
  });
  checkboxes.forEach(input => input.addEventListener('change', updateSelection));
  search.addEventListener('input', () => {
    const query = search.value.trim().toLowerCase();
    options.querySelectorAll('.header-filter-option:not(.header-filter-select-all)').forEach(option => {
      option.hidden = query !== '' && !option.dataset.value.includes(query);
    });
  });

  filterButton.addEventListener('click', event => {
    event.stopPropagation();
    menu.hidden = !menu.hidden;
    if (!menu.hidden) search.focus();
  });
  filterButton.textContent = selectedValues === null
    ? `All ${values.length} selected`
    : `${selectedValues.size} of ${values.length} selected`;
  filterButton.classList.toggle('active', selectedValues !== null);
  return menu;
}

function buildStatusFilterMenu(filterButton) {
  return buildFilterMenu('status', 'Status', filterButton);
}

function buildCollectionFilterMenu(filterButton) {
  return buildFilterMenu('in_collection', 'In Collection', filterButton);
}

document.addEventListener('click', event => {
  if (event.target.closest('.header-filter-menu') || event.target.closest('.header-filter-button')) return;
  document.querySelectorAll('.header-filter-menu:not([hidden])').forEach(menu => {
    menu.hidden = true;
  });
});

function buildHeaderFilters() {
  const statusControl = document.getElementById('statusFilterControl');
  const collectionControl = document.getElementById('collectionFilterControl');
  [
    ['Status', 'status', statusControl],
    ['In Collection', 'in_collection', collectionControl]
  ].forEach(([title, field, control]) => {
    control.innerHTML = '';
    const titleElement = document.createElement('span');
    titleElement.className = 'header-filter-title';
    titleElement.textContent = title;
    control.appendChild(titleElement);
    const button = document.createElement('button');
    button.className = 'header-filter-button';
    button.type = 'button';
    button.setAttribute('aria-label', `Filter ${title}`);
    control.appendChild(button);
    control.appendChild(field === 'status'
      ? buildStatusFilterMenu(button)
      : buildCollectionFilterMenu(button));
  });
}

function buildFilterRow() {
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  const columns = getActiveColumns();
  const frag = document.createDocumentFragment();
  columns.forEach((col, index) => {
    const th = document.createElement('th');
    if (col.field) {
      const input = document.createElement('input');
      input.placeholder = 'Filter…';
      input.addEventListener('input', () => {
        filters[index] = input.value.trim().toLowerCase();
        render();
      });
      th.appendChild(input);
    }
    frag.appendChild(th);
  });
  row.appendChild(frag);
}

function sortByColumn(colIndex) {
  const columns = getActiveColumns();
  const col = columns[colIndex];
  if (!col.field) return;
  sortState.dir = sortState.colIndex === colIndex ? -sortState.dir : 1;
  sortState.colIndex = colIndex;

  document.querySelectorAll('#headerRow th').forEach(th => th.classList.remove('sort-asc', 'sort-desc'));
  const th = document.querySelector(`#headerRow th[data-col-index="${colIndex}"]`);
  if (th) th.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');

  render();
}

function render() {
  const columns = getActiveColumns();
  let games = allGames.filter(game => {
    return Object.entries(filters).every(([colIndex, value]) => {
      if (!value) return true;
      const field = columns[Number(colIndex)]?.field;
      if (!field) return true;
      const cell = game[field];
      return cell !== null && cell !== undefined && String(cell).toLowerCase().includes(value);
    });
  })
    .filter(game => selectedStatusValues === null || selectedStatusValues.has(game.status))
    .filter(game => selectedCollectionValues === null
      || game.in_collection.some(value => selectedCollectionValues.has(value)));

  if (sortState.colIndex !== null && columns[sortState.colIndex]) {
    const col = columns[sortState.colIndex];
    games = [...games].sort((a, b) => {
      const av = a[col.field];
      const bv = b[col.field];
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortState.dir;
      return String(av).localeCompare(String(bv)) * sortState.dir;
    });
  }

  document.getElementById('bodyRows').innerHTML = '';
  buildRows(games);
  document.getElementById('status').textContent = `Showing ${games.length} of ${allGames.length} games`;
}

function enableColumnResize(headerRow) {
  headerRow.querySelectorAll('.col-resizer').forEach(resizer => {
    const th = resizer.parentElement;
    const colIndex = Number(th.dataset.colIndex);
    resizer.addEventListener('mousedown', e => {
      e.preventDefault();
      const col = document.getElementById('colGroup').children[colIndex];
      const startX = e.pageX;
      const startWidth = th.getBoundingClientRect().width;
      resizer.classList.add('resizing');
      function onMouseMove(ev) {
        const newWidth = Math.max(40, startWidth + (ev.pageX - startX));
        col.style.width = newWidth + 'px';
        updateTableWidth();
      }
      function onMouseUp() {
        resizer.classList.remove('resizing');
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  });
}

let selectedGame = null;

function setDialogText(id, value, fallback = 'N/A') {
  document.getElementById(id).textContent = value === null || value === undefined || value === '' ? fallback : value;
}

function formatNumber(value) {
  if (value === null || value === undefined || value === '') return 'N/A';
  const number = Number(value);
  return Number.isFinite(number) ? number.toLocaleString('en-US') : 'N/A';
}

function formatRating(value) {
  if (value === null || value === undefined || value === '') return 'N/A';
  const number = Number(value);
  return Number.isFinite(number) ? number.toFixed(1) : 'N/A';
}

function formatGeekRating(value) {
  if (value === null || value === undefined || value === '') return 'N/A';
  const number = Number(value);
  return Number.isFinite(number) ? number.toFixed(3) : 'N/A';
}

function getBoardGameUrl(id, title) {
  const slug = String(title || '')
    .trim()
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
  return `https://boardgamegeek.com/boardgame/${encodeURIComponent(String(id))}/${slug}`;
}

function openGameDialog(game) {
  selectedGame = game;
  const dialog = document.getElementById('gameDialog');
  const cover = document.getElementById('dialogCover');
  const coverUrl = game['collectiondetails2026.image'] || game['collectiondetails2026.thumbnail'];
  cover.hidden = !coverUrl;
  cover.src = coverUrl || '';
  cover.alt = game.game_name ? game.game_name + ' cover' : '';
  cover.onerror = () => { cover.hidden = true; };

  setDialogText('dialogGameTitle', game.game_name, 'Untitled game');
  setDialogText('dialogYear', game.year_published ? '(' + game.year_published + ')' : '');
  setDialogText('dialogOverallRank', formatNumber(game['boardgames_ranks.rank']));
  setDialogText('dialogFamilyRank', formatNumber(game['boardgames_ranks.familygames_rank']));
  setDialogText('dialogRating', formatRating(game.average_rating));
  setDialogText('dialogGeekRating', formatGeekRating(game['collectiondetails2026.value4']));
  setDialogText('dialogPlayers', game.min_players !== null && game.max_players !== null
    ? game.min_players + '-' + game.max_players
    : 'N/A');
  setDialogText('dialogPlayTime', game.playing_time_min !== null && game.playing_time_max !== null
    ? game.playing_time_min === game.playing_time_max ? game.playing_time_min + ' Min' : game.playing_time_min + '-' + game.playing_time_max + ' Min'
    : 'N/A');
  setDialogText('dialogAge', game.min_age ? game.min_age + '+' : 'N/A');
  setDialogText('dialogWeight', game.weight === null ? 'N/A' : game.weight.toFixed(2));
  setDialogText('dialogDescription', 'Description unavailable in the loaded collection data.', 'Description unavailable in the loaded collection data.');
  setDialogText('dialogCollectionStatus', game.status, 'Not in collection');
  setDialogText('dialogStatus', game.status, 'N/A');
  setDialogText('dialogYourRating', game.rating === null ? 'N/A' : game.rating);
  setDialogText('dialogYourPlays', game.numplays === null ? '0' : formatNumber(game.numplays));
  dialog.showModal();
}

function closeGameDialog() {
  const dialog = document.getElementById('gameDialog');
  if (dialog.open) dialog.close();
}

document.getElementById('dialogClose').addEventListener('click', closeGameDialog);
document.getElementById('dialogPlayButton').addEventListener('click', () => {
  if (!selectedGame) return;
  selectedGame.numplays = (selectedGame.numplays || 0) + 1;
  setDialogText('dialogYourPlays', formatNumber(selectedGame.numplays));
  render();
});

function buildRows(games) {
  const tbody = document.getElementById('bodyRows');
  const columns = getActiveColumns();
  const gameTable = document.getElementById('gameTable');
  gameTable.classList.toggle('view-collection-table', activeView === 'collection');
  document.body.classList.toggle('collection-view', activeView === 'collection');
  const frag = document.createDocumentFragment();
  games.forEach(game => {
    const tr = document.createElement('tr');
    columns.forEach(col => {
      const td = document.createElement('td');
      if (col.field && game[col.field] !== undefined && game[col.field] !== null) {
        const value = game[col.field];
        if (col.field === THUMBNAIL_COLUMN.field) {
          td.classList.add('thumbnail-cell');
          if (value) {
            const link = document.createElement('a');
            link.className = 'bgg-id-link';
            link.href = getBoardGameUrl(game[RANK_ID_FIELD], game.game_name);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            const thumbnail = document.createElement('img');
            thumbnail.className = 'collection-thumbnail';
            thumbnail.src = value;
            thumbnail.alt = game.game_name ? game.game_name + ' thumbnail' : 'Game thumbnail';
            thumbnail.onerror = () => { thumbnail.remove(); };
            link.appendChild(thumbnail);
            td.appendChild(link);
          }
        } else if (col.field === RANK_ID_FIELD) {
          const link = document.createElement('a');
          link.className = 'bgg-id-link';
          link.href = getBoardGameUrl(value, game.game_name);
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = value;
          td.appendChild(link);
        } else if (col.field === 'game_name') {
          td.classList.add('dialog-trigger');
          if (activeView === 'collection') td.classList.add('title-cell');
          td.textContent = value;
          td.tabIndex = 0;
          td.setAttribute('role', 'button');
          td.addEventListener('click', () => openGameDialog(game));
          td.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openGameDialog(game);
            }
          });
        } else if (activeView === 'collection' && col.field === 'bgg_rating') {
          td.classList.add('rating-cell');
          td.textContent = value === null ? 'N/A' : value;
        } else if (activeView === 'collection' && col.field === 'rating') {
          td.classList.add('rating-cell');
          td.textContent = value === null ? 'N/A' : value;
        } else if (activeView === 'collection' && col.field === 'status') {
          td.classList.add('status-cell');
          if (value === 'Owned') td.classList.add('owned');
          if (value === 'Prev. Owned') td.classList.add('prev-owned');
          td.textContent = value;
        } else if (activeView === 'collection' && col.field === 'in_collection') {
          td.classList.add('in-collection-cell');
          td.textContent = value.join(', ');
        } else if (activeView === 'collection' && col.field === 'numplays') {
          td.classList.add('plays-cell');
          td.textContent = value === null ? '' : value;
        } else if (activeView === 'collection' && col.field === 'comment') {
          td.classList.add('comment-cell');
          td.textContent = value || '';
        } else {
          td.textContent = value;
          if (WRAP_FIELDS.has(col.field)) td.classList.add('wrap');
        }
      }
      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
}

function changeView(nextView) {
  activeView = nextView;
  Object.keys(filters).forEach(key => delete filters[key]);
  sortState.colIndex = null;
  sortState.dir = 1;
  document.querySelectorAll('#headerRow th').forEach(th => th.classList.remove('sort-asc', 'sort-desc'));
  buildHeader();
  render();
}

function changeThumbnail(enabled) {
  thumbnailEnabled = enabled;
  buildHeader();
  render();
}

function loadData() {
  const status = document.getElementById('status');
  status.textContent = 'Loading collection.csv, boardgames_ranks.csv, and collectiondetails2026.csv...';
  Promise.all([
    loadCsvFile('collection.csv'),
    loadCsvFile('boardgames_ranks.csv'),
    loadCsvFile('collectiondetails2026.csv')
  ])
    .then(([collectionRows, rankRows, detailRows]) => {
      ADDITIONAL_COLUMNS.length = 0;
      let joinedRows = addJoinedColumns(collectionRows, rankRows, 'boardgames_ranks', 'id');
      joinedRows = addJoinedColumns(joinedRows, detailRows, 'collectiondetails2026', 'objectid');
      allGames = joinedRows.map(normalizeCsvRow);
      buildHeaderFilters();
      buildHeader();
      const viewSelect = document.getElementById('viewSelect');
      viewSelect.addEventListener('change', (event) => {
        changeView(event.target.value);
      });
      document.getElementById('thumbnailToggle').addEventListener('change', (event) => {
        changeThumbnail(event.target.checked);
      });
      render();
    })
    .catch(err => {
      status.classList.add('error');
      status.textContent = 'Failed to load data: ' + err.message;
    });
}

loadData();
</script>
