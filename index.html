<script>

const BGG_COLUMNS = [
  { header: 'Name',      field: 'game_name' },
  { header: 'Rating',    field: 'average_rating' },
  { header: 'Complex',   field: 'weight' },
  { header: 'Yr',        field: 'year_published' },
  { header: 'P-',        field: 'min_players' },
  { header: 'P+',        field: 'max_players' },
  { header: 'Ages',      field: 'min_age' },
  { header: 'Tmin',      field: 'playing_time_min' },
  { header: 'Tmax',      field: 'playing_time_max' },

const ADDITIONAL_COLUMNS = [];

  'Sagrada_Quick_Reference_Guide_Clean-199561.pdf'
];
const VALUE3_FIELD = 'boardgame.average';
const RANK_ID_FIELD = 'boardgames_ranks.id';

let activeView = 'collection';
let thumbnailEnabled = true;
let selectedCollectionValues = new Set(['fortrade']);
const COLLECTION_FLAGS = ['own', 'fortrade', 'want', 'wanttobuy', 'wanttoplay', 'prevowned', 'preordered', 'wishlist'];
const WRAP_FIELDS = new Set(['description', 'categories', 'mechanics', 'alternate_names', 'families', 'publishers']);
const COLLECTION_DETAILS_HEADERS = ['totalitems', 'termsofuse', 'pubdate', 'objecttype', 'objectid', 'subtype', 'collid', 'name', 'sortindex', 'yearpublished', 'image', 'thumbnail', 'minplayers', 'maxplayers', 'minplaytime', 'maxplaytime', 'playingtime', 'numowned', 'value', 'value2', 'value3', 'value4', 'value5', 'value6', 'own', 'prevowned', 'fortrade', 'want', 'wanttoplay', 'wanttobuy', 'wishlist', 'preordered', 'lastmodified', 'wishlistpriority', 'numplays', 'comment', 'originalname'];

  { header: '', field: 'thumbnail' },
  { header: 'Name', field: 'name' },
  { header: 'Year', field: 'yearpublished' },
  { header: 'Players', field: 'players' },

  { header: 'Status', field: 'status' },

  { header: 'Plays', field: 'numplays' },
  { header: 'Comment', field: 'comment' }
];

const SUMMARY_CARDS = [
  { flag: 'own', title: 'Own' },
  { flag: 'fortrade', title: 'For Trade' },
  { flag: 'prevowned', title: 'Prev Owned' },
  { flag: 'wishlist', title: 'Wishlist' }
];
const summaryCardRefs = [];

function buildSummaryCards() {
  const container = document.getElementById('summaryCards');
  container.innerHTML = '';
  summaryCardRefs.length = 0;
  SUMMARY_CARDS.forEach(({ flag, title }) => {
    const card = document.createElement('div');
    card.className = 'summary-card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-pressed', 'false');
    const top = document.createElement('div');
    top.className = 'summary-card-top';
    const titleEl = document.createElement('div');
    titleEl.className = 'summary-card-title';
    titleEl.textContent = title.toUpperCase();
    const countEl = document.createElement('div');
    countEl.className = 'summary-card-count';
    top.append(titleEl, countEl);
    const visibleEl = document.createElement('div');
    visibleEl.className = 'summary-card-visible';
    card.append(top, visibleEl);
    container.appendChild(card);
    const activate = () => {
      selectedCollectionValues = selectedCollectionValues?.size === 1 && selectedCollectionValues.has(flag)
        ? null
        : new Set([flag]);
      render();
    };
    card.addEventListener('click', activate);
    card.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activate();
      }
    });
    summaryCardRefs.push({ flag, card, countEl, visibleEl });
  });
}

function updateSummaryCards(visibleGames) {
  summaryCardRefs.forEach(({ flag, card, countEl, visibleEl }) => {
    const total = allGames.filter(game => game.in_collection.includes(flag)).length;
    const shown = visibleGames.filter(game => game.in_collection.includes(flag)).length;
    countEl.textContent = total;
    visibleEl.textContent = `Showing ${shown}`;
    const active = selectedCollectionValues?.size === 1 && selectedCollectionValues.has(flag);
    card.classList.toggle('active', active);
    card.setAttribute('aria-pressed', String(active));
  });
}

function getActiveColumns() {
  const columns = activeView === 'collection' ? COLLECTION_COLUMNS : COLUMNS;
  const activeColumns = columns.concat(ADDITIONAL_COLUMNS);
  if (activeView !== 'collection') {
    const detailedColumns = thumbnailEnabled ? [THUMBNAIL_COLUMN, ...activeColumns] : activeColumns;
    return [...detailedColumns, RULES_COLUMN];
  }
  const value3Column = ADDITIONAL_COLUMNS.find(column => column.field === VALUE3_FIELD);
  const averageRatingColumn = value3Column
    ? { ...value3Column, header: 'Average Rating' }
    : null;
  const collectionColumns = value3Column
    ? [COLLECTION_COLUMNS[0], averageRatingColumn, ...COLLECTION_COLUMNS.slice(1)]
    : COLLECTION_COLUMNS;
  const visibleColumns = thumbnailEnabled ? [THUMBNAIL_COLUMN, ...collectionColumns] : collectionColumns;
  return [...visibleColumns, RULES_COLUMN];
}

function toNumber(value) {
  if (value === null || value === undefined || value === '') return null;
  const num = Number(String(value).replace(/[^0-9.-]/g, ''));
  return Number.isFinite(num) ? num : null;
}

function parseAge(value) {
  if (value === null || value === undefined || value === '') return null;
  const match = String(value).match(/\d+/);
  return match ? Number(match[0]) : null;
}

function xmlValue(element, selector, fallback = '') {
  const node = element.querySelector(selector);
  return node?.getAttribute('value') || node?.textContent?.trim() || fallback;
}

function parseBggCollection(xmlText) {
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (xml.querySelector('parsererror')) throw new Error('BGG returned invalid collection data.');
  const error = xml.querySelector('error message');
  if (error) throw new Error(error.textContent.trim());
  return [...xml.documentElement.querySelectorAll(':scope > item')].map(item => {
    const stats = item.querySelector('stats');
    const statusElement = item.querySelector('status');
    const ratingElement = item.querySelector('rating');
    const status = statusElement
      ? ['own', 'prevowned', 'fortrade', 'want', 'wanttoplay', 'wanttobuy', 'wishlist', 'preordered']
        .filter(flag => statusElement.getAttribute(flag) === '1')
        .join(', ')
      : '';
    const row = Object.fromEntries(COLLECTION_DETAILS_HEADERS.map(header => [header, '']));
    Object.assign(row, {
      totalitems: xml.documentElement.getAttribute('totalitems') || '',
      termsofuse: 'https://boardgamegeek.com/xmlapi/termsofuse',
      objecttype: 'thing',
      objectid: item.getAttribute('objectid') || item.getAttribute('id') || '',
      subtype: item.getAttribute('subtype') || 'boardgame',
      collid: item.getAttribute('collid') || '',
      name: xmlValue(item, 'name'),
      sortindex: item.getAttribute('sortindex') || '',
      yearpublished: xmlValue(item, 'yearpublished'),
      image: xmlValue(item, 'image'),
      thumbnail: xmlValue(item, 'thumbnail'),
      minplayers: stats?.getAttribute('minplayers') || '',
      maxplayers: stats?.getAttribute('maxplayers') || '',
      minplaytime: stats?.getAttribute('minplaytime') || '',
      maxplaytime: stats?.getAttribute('maxplaytime') || '',
      playingtime: stats?.getAttribute('playingtime') || '',
      numowned: stats?.getAttribute('numowned') || '',
      own: statusElement?.getAttribute('own') || '',
      prevowned: statusElement?.getAttribute('prevowned') || '',
      fortrade: statusElement?.getAttribute('fortrade') || '',
      want: statusElement?.getAttribute('want') || '',
      wanttoplay: statusElement?.getAttribute('wanttoplay') || '',
      wanttobuy: statusElement?.getAttribute('wanttobuy') || '',
      wishlist: statusElement?.getAttribute('wishlist') || '',
      preordered: statusElement?.getAttribute('preordered') || '',
      lastmodified: statusElement?.getAttribute('lastmodified') || '',
      wishlistpriority: statusElement?.getAttribute('wishlistpriority') || '',
      numplays: item.getAttribute('numplays') || '',
      comment: item.getAttribute('comment') || '',
      originalname: item.getAttribute('originalname') || '',
      status,
      players: stats ? `${stats.getAttribute('minplayers') || '?'}-${stats.getAttribute('maxplayers') || '?'}` : '',
      rating: ratingElement?.getAttribute('value') || ''
    });
    return row;
  });
}

function wait(milliseconds) {
  return new Promise(resolve => setTimeout(resolve, milliseconds));
}

async function fetchBggCollection(username, accessToken = '') {
  const endpoint = `https://boardgamegeek.com/xmlapi2/collection?username=${encodeURIComponent(username)}&stats=1`;
  const headers = { Accept: 'application/xml' };
  if (accessToken) headers.Authorization = `Bearer ${accessToken}`;
  for (let attempt = 0; attempt < 5; attempt++) {
    const response = await fetch(endpoint, { headers });
    if (response.status === 202) {
      await wait(2000);
      continue;
    }
    if (response.status === 401) {
      const error = new Error('BGG requires an API access token.');
      error.code = 'AUTH_REQUIRED';
      throw error;
    }
    if (!response.ok) throw new Error(`BGG returned HTTP ${response.status}.`);
    return parseBggCollection(await response.text());
  }
  throw new Error('BGG is still preparing that collection. Please try again.');
}

function renderUserLookup(rows) {
  const header = document.getElementById('userLookupHeader');
  const body = document.getElementById('userLookupBody');
  header.innerHTML = '';
  body.innerHTML = '';
  USER_LOOKUP_COLUMNS.forEach(column => {
    const th = document.createElement('th');
    th.textContent = column.header;
    header.appendChild(th);
  });
  rows.forEach(row => {
    const tr = document.createElement('tr');
    USER_LOOKUP_COLUMNS.forEach(column => {
      const td = document.createElement('td');
      if (column.field === 'thumbnail' && row.thumbnail) {
        const image = document.createElement('img');
        image.className = 'user-lookup-thumbnail';
        image.src = row.thumbnail;
        image.alt = `${row.name} thumbnail`;
        td.appendChild(image);
      } else {
        td.textContent = row[column.field] || '';
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

function csvEscape(value) {
  const text = value === null || value === undefined ? '' : String(value);
  return /[",\r\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
}

function downloadUserCollection(username, rows) {
  const csv = [
    COLLECTION_DETAILS_HEADERS.join(','),
    ...rows.map(row => COLLECTION_DETAILS_HEADERS.map(header => csvEscape(row[header])).join(','))
  ].join('\r\n');
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  link.download = `collectiondetails-${username}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
}

async function openUserLookup() {
  const username = window.prompt('Enter a BGG username:');
  if (!username?.trim()) return;
  const dialog = document.getElementById('userLookupDialog');
  const status = document.getElementById('userLookupStatus');
  const download = document.getElementById('userLookupDownload');
  const cleanUsername = username.trim();
  document.getElementById('userLookupTitle').textContent = `${cleanUsername}'s BGG Collection`;
  status.className = 'user-lookup-status';
  status.textContent = 'Loading collection from BoardGameGeek...';
  download.disabled = true;
  document.getElementById('userLookupHeader').innerHTML = '';
  document.getElementById('userLookupBody').innerHTML = '';
  dialog.showModal();
  try {
    let rows;
    try {
      rows = await fetchBggCollection(cleanUsername);
    } catch (error) {
      if (error.code !== 'AUTH_REQUIRED') throw error;
      const accessToken = window.prompt('BGG now requires an API access token. Enter it to continue:');
      if (!accessToken?.trim()) throw new Error('An API access token is required by BGG.');
      status.textContent = 'Loading collection with the BGG access token...';
      rows = await fetchBggCollection(cleanUsername, accessToken.trim());
    }
    renderUserLookup(rows);
    status.textContent = `${rows.length.toLocaleString('en-US')} games loaded.`;
    download.disabled = false;
    download.onclick = () => downloadUserCollection(cleanUsername, rows);
  } catch (error) {
    status.className = 'user-lookup-status error';
    status.textContent = `Unable to load collection: ${error.message}`;
  }
}

function setupUserLookupMenu() {
  const title = document.getElementById('collectionTitle');
  const menu = document.getElementById('userLookupMenu');
  const menuButton = document.getElementById('userLookupMenuButton');
  const rulesMenu = document.getElementById('rulesSubmenu');
  const rulesButton = document.getElementById('rulesSubmenuButton');

  function closeAllMenus() {
    menu.hidden = true;
    rulesMenu.hidden = true;
    rulesButton.setAttribute('aria-expanded', 'false');
  }

  title.addEventListener('contextmenu', event => {
    event.preventDefault();
    menu.hidden = false;
    rulesMenu.hidden = true;
    rulesButton.setAttribute('aria-expanded', 'false');
    menu.style.left = `${Math.min(event.clientX, window.innerWidth - menu.offsetWidth - 8)}px`;
    menu.style.top = `${Math.min(event.clientY, window.innerHeight - menu.offsetHeight - 8)}px`;
    menuButton.focus();
  });
  menuButton.addEventListener('click', () => {
    closeAllMenus();
    openUserLookup();
  });
  document.getElementById('hideThumbnailsMenuButton').addEventListener('click', () => {
    closeAllMenus();
    changeThumbnail(false);
  });
  rulesButton.addEventListener('click', event => {
    event.stopPropagation();
    const open = rulesMenu.hidden;
    rulesMenu.hidden = !open;
    rulesButton.setAttribute('aria-expanded', String(open));
  });
  rulesMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => closeAllMenus());
  });
  document.addEventListener('click', event => {
    if (!event.target.closest('#userLookupMenu')) {
      closeAllMenus();
    }
  });
  document.getElementById('userLookupClose').addEventListener('click', () => {
    document.getElementById('userLookupDialog').close();
  });
}

function parseCSV(text) {
  const rows = [];
  let currentRow = [];
  let currentValue = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (char === '"') {
      if (inQuotes && text[i + 1] === '"') {
        currentValue += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
      continue;
    }

    if (char === ',' && !inQuotes) {
      currentRow.push(currentValue);
      currentValue = '';
      continue;
    }

    if ((char === '\n' || char === '\r') && !inQuotes) {
      if (char === '\r' && text[i + 1] === '\n') {
        i++;
      }
      currentRow.push(currentValue);
      if (currentRow.some(value => value !== '')) {
        rows.push(currentRow);
      }
      currentRow = [];
      currentValue = '';
      continue;
    }

    currentValue += char;
  }

  if (currentValue.length > 0 || currentRow.length > 0) {
    currentRow.push(currentValue);
    if (currentRow.some(value => value !== '')) {
      rows.push(currentRow);
    }
  }

  if (rows.length === 0) return [];

  const [header, ...dataRows] = rows;
  return dataRows.map(row => {
    const entry = {};
    header.forEach((key, index) => {
      const value = row[index] ?? '';
      entry[key.trim()] = value.trim();
    });
    return entry;
  });
}

function getStatus(row) {
  if (row.own === '1') return 'Owned';
  if (row.prevowned === '1') return 'Prev. Owned';
  if (row.wanttoplay === '1') return 'Want to Play';
  if (row.want === '1') return 'Want';
  if (row.wishlist === '1') return 'Wishlist';
  if (row.fortrade === '1') return 'For Trade';
  return '';
}

function getCollectionValues(row) {
  return COLLECTION_FLAGS.filter(flag => row[flag] === '1');
}

function normalizeCsvRow(row) {
  const status = getStatus(row);
  const inCollection = getCollectionValues(row);
  const comment = row.comment || row.privatecomment || '';
  const normalized = {
    game_name: row.objectname || row.originalname || '',
    average_rating: toNumber(row.average),
    weight: toNumber(row.avgweight),
    year_published: toNumber(row.yearpublished),
    min_players: toNumber(row.minplayers),
    max_players: toNumber(row.maxplayers),
    min_age: parseAge(row.bggrecagerange),
    playing_time_min: toNumber(row.minplaytime),
    playing_time_max: toNumber(row.maxplaytime),
    bgg_id: toNumber(row.objectid),
    bgg_rating: toNumber(row.baverage),
    rating: toNumber(row.rating),
    numplays: toNumber(row.numplays),
    status,
    in_collection: inCollection,
    comment,
    categories: '',
    mechanics: '',
    description: ''
  };
  Object.keys(row).forEach(field => {
    if (field.includes('.')) normalized[field] = row[field];
  });
  return normalized;
}

function loadCsvFile(filename) {
  return fetch(filename)
    .then(response => {
      if (!response.ok) {
        throw new Error(filename + ' could not be loaded (HTTP ' + response.status + ')');
      }
      return response.text();
    })
    .catch(err => {
      // fetch() of local files is blocked by browsers when the page is opened via file://;
      // fall back to the pre-embedded copy in csv_data.js in that case.
      const embedded = window.CSV_DATA && window.CSV_DATA[filename];
      if (embedded !== undefined) return embedded;
      throw err;
    })
    .then(csvText => {
      const rows = parseCSV(csvText);
      if (!rows.length) throw new Error(filename + ' is empty or invalid.');
      return rows;
    });
}

function addJoinedColumns(collectionRows, sourceRows, sourceName, sourceKey) {
  const sourceFields = Object.keys(sourceRows[0] || {});
  sourceFields.forEach(field => {
    ADDITIONAL_COLUMNS.push({
      header: sourceName + '.' + field,
      field: sourceName + '.' + field
    });
  });

  const sourceByKey = new Map(sourceRows.map(row => [String(row[sourceKey] ?? '').trim(), row]));
  return collectionRows.map(row => {
    const sourceRow = sourceByKey.get(String(row.objectid ?? '').trim());
    const joinedRow = { ...row };
    sourceFields.forEach(field => {
      joinedRow[sourceName + '.' + field] = sourceRow?.[field] ?? '';
    });
    return joinedRow;
  });
}

// Chrome only honors <col> widths under table-layout:fixed when the table itself has

function updateTableWidth() {

    .reduce((sum, col) => sum + parseFloat(col.style.width || '120'), 0);

const sortState = { colIndex: null, dir: 1 };
const filters = {};

function buildFilterRow() {
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  const columns = getActiveColumns();
  const frag = document.createDocumentFragment();
  columns.forEach((col, index) => {
    const th = document.createElement('th');
    if (col.field) {
      const input = document.createElement('input');
      input.placeholder = 'Filter…';
      input.addEventListener('input', () => {
        filters[index] = input.value.trim().toLowerCase();
        render();
      });
      th.appendChild(input);
    }
    frag.appendChild(th);
  });
  row.appendChild(frag);
}

function sortByColumn(colIndex) {
  const columns = getActiveColumns();
  const col = columns[colIndex];
  if (!col.field) return;
  sortState.dir = sortState.colIndex === colIndex ? -sortState.dir : 1;
  sortState.colIndex = colIndex;

  document.querySelectorAll('#headerRow th').forEach(th => th.classList.remove('sort-asc', 'sort-desc'));
  const th = document.querySelector(`#headerRow th[data-col-index="${colIndex}"]`);
  if (th) th.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');

  render();
}

function render() {
  const columns = getActiveColumns();
  let games = allGames.filter(game => {
    return Object.entries(filters).every(([colIndex, value]) => {
      if (!value) return true;
      const field = columns[Number(colIndex)]?.field;
      if (!field) return true;
      const cell = game[field];
      return cell !== null && cell !== undefined && String(cell).toLowerCase().includes(value);
    });
  })
    .filter(game => selectedCollectionValues === null
      || game.in_collection.some(value => selectedCollectionValues.has(value)));

  if (sortState.colIndex !== null && columns[sortState.colIndex]) {
    const col = columns[sortState.colIndex];
    games = [...games].sort((a, b) => {
      const av = a[col.field];
      const bv = b[col.field];
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortState.dir;
      return String(av).localeCompare(String(bv)) * sortState.dir;
    });
  }

  document.getElementById('bodyRows').innerHTML = '';
  buildRows(games);
  updateSummaryCards(games);
}

function enableColumnResize(headerRow) {
  headerRow.querySelectorAll('.col-resizer').forEach(resizer => {
    const th = resizer.parentElement;
    const colIndex = Number(th.dataset.colIndex);
    resizer.addEventListener('mousedown', e => {
      e.preventDefault();
      const col = document.getElementById('colGroup').children[colIndex];
      const startX = e.pageX;
      const startWidth = th.getBoundingClientRect().width;
      resizer.classList.add('resizing');
      function onMouseMove(ev) {
        const newWidth = Math.max(40, startWidth + (ev.pageX - startX));
        col.style.width = newWidth + 'px';
        updateTableWidth();
      }
      function onMouseUp() {
        resizer.classList.remove('resizing');
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  });
}

function getObjectiveFromDescription(description) {

  const sentences = description.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [];
  const objective = sentences.find(sentence => /\b(objective|goal|win|victory|score|compete|first player)\b/i.test(sentence));

}

  document.body.classList.toggle('collection-view', activeView === 'collection');
  const frag = document.createDocumentFragment();
  games.forEach(game => {
    const tr = document.createElement('tr');
    columns.forEach(col => {
      const td = document.createElement('td');
      if (col.type === 'rules') {
        td.className = 'rules-cell';
        const button = document.createElement('button');
        button.className = 'rules-button';
        button.type = 'button';
        button.textContent = 'Quick Rules';
        button.setAttribute('aria-label', `Open quick rules for ${game.game_name || 'this game'}`);
        button.addEventListener('click', () => openRulesDialog(game));
        td.appendChild(button);
      } else if (col.field && game[col.field] !== undefined && game[col.field] !== null) {
        const value = game[col.field];
        if (col.field === THUMBNAIL_COLUMN.field) {
          td.classList.add('thumbnail-cell');
          const thumbUrl = getLocalThumbnailUrl(value, game.game_name);
          if (thumbUrl) {
            const link = document.createElement('a');
            link.className = 'bgg-id-link';
            link.href = getBoardGameUrl(game[RANK_ID_FIELD], game.game_name);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            const thumbnail = document.createElement('img');
            thumbnail.className = 'collection-thumbnail';
            thumbnail.src = thumbUrl;
            thumbnail.alt = game.game_name ? game.game_name + ' thumbnail' : 'Game thumbnail';
            thumbnail.onerror = () => { thumbnail.remove(); };
            link.appendChild(thumbnail);
            td.appendChild(link);
          }
        } else if (col.field === RANK_ID_FIELD) {
          const link = document.createElement('a');
          link.className = 'bgg-id-link';
          link.href = getBoardGameUrl(value, game.game_name);
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = value;
          td.appendChild(link);
        } else if (col.field === 'game_name') {
          td.classList.add('dialog-trigger');
          if (activeView === 'collection') td.classList.add('title-cell');
          td.textContent = value;
          td.tabIndex = 0;
          td.setAttribute('role', 'button');
          td.addEventListener('click', () => openGameDialog(game));
          td.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openGameDialog(game);
            }
          });
        } else if (activeView === 'collection' && col.field === 'bgg_rating') {
          td.classList.add('rating-cell');
          td.textContent = formatTableRating(value);
        } else if (activeView === 'collection' && col.field === 'rating') {
          td.classList.add('rating-cell');
          td.textContent = value === null ? 'N/A' : value;
        } else if (activeView === 'collection' && col.field === VALUE3_FIELD) {
          td.classList.add('rating-cell');
          td.textContent = formatTableRating(value);
        } else if (activeView === 'collection' && col.field === 'status') {
          td.classList.add('status-cell');
          if (value === 'Owned') td.classList.add('owned');
          if (value === 'Prev. Owned') td.classList.add('prev-owned');
          td.textContent = value;
        } else if (activeView === 'collection' && col.field === 'in_collection') {
          td.classList.add('in-collection-cell');
          td.textContent = value.join(', ');
        } else if (activeView === 'collection' && col.field === 'numplays') {
          td.classList.add('plays-cell');
          td.textContent = value === null ? '' : value;
        } else if (activeView === 'collection' && col.field === 'comment') {
          td.classList.add('comment-cell');
          td.textContent = value || '';
        } else {
          td.textContent = value;
          if (WRAP_FIELDS.has(col.field)) td.classList.add('wrap');
        }
      }
      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
}

function changeView(nextView) {
  activeView = nextView;
  Object.keys(filters).forEach(key => delete filters[key]);
  sortState.colIndex = null;
  sortState.dir = 1;
  document.querySelectorAll('#headerRow th').forEach(th => th.classList.remove('sort-asc', 'sort-desc'));
  buildHeader();
  render();
}

function changeThumbnail(enabled) {
  thumbnailEnabled = enabled;
  buildHeader();
  render();
}

function loadData() {
  const status = document.getElementById('status');
  status.textContent = 'Loading collection.csv, boardgames_ranks.csv, and More data/boardgame.csv...';
  Promise.all([
    loadCsvFile('collection.csv'),
    loadCsvFile('boardgames_ranks.csv'),
    loadCsvFile('More data/boardgame.csv')
  ])
    .then(([collectionRows, rankRows, detailRows]) => {
      ADDITIONAL_COLUMNS.length = 0;
      let joinedRows = addJoinedColumns(collectionRows, rankRows, 'boardgames_ranks', 'id');
      joinedRows = addJoinedColumns(joinedRows, detailRows, 'boardgame', 'bg_id');
      allGames = joinedRows.map(normalizeCsvRow);
      buildHeader();
      buildSummaryCards();
      const viewSelect = document.getElementById('viewSelect');
      viewSelect.addEventListener('change', (event) => {
        changeView(event.target.value);
      });
      status.hidden = true;
      render();
    })
    .catch(err => {
      status.classList.add('error');
      status.textContent = 'Failed to load data: ' + err.message;
    });
}

loadData();
</script>
</body>
</html>
