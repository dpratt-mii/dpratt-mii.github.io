<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OurBGG</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
  header { padding: 12px 16px; background: #2b2f38; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; }
  .view-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .view-toggle label { font-weight: 600; }
  .view-toggle select { padding: 6px 10px; border-radius: 4px; border: 1px solid #d0d7de; font-size: 13px; }
  #status { padding: 8px 16px; font-size: 13px; color: #444; }
  .view-collection-table thead th {
    background: #ffffff;
    color: #1d5fb3;
    border-color: #cfd6de;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    white-space: normal;
  }
  .view-collection-table tbody td {
    padding: 10px 8px;
    vertical-align: top;
    background: #fff;
    color: #2c2c2c;
  }
  .view-collection-table tbody tr:nth-child(even) td { background: #f8f8f8; }
  .view-collection-table tbody td.title-cell {
    color: #1d5fb3;
    font-size: 18px;
    line-height: 1.2;
    font-weight: 500;
    white-space: normal;
  }
  .view-collection-table tbody td.rating-cell,
  .view-collection-table tbody td.status-cell,
  .view-collection-table tbody td.plays-cell { text-align: center; }
  .view-collection-table tbody td.status-cell { font-weight: 600; }
  .view-collection-table tbody td.status-cell.owned { color: #2a7a1b; }
  .view-collection-table tbody td.status-cell.prev-owned { color: #5d4ca0; }
  .view-collection-table tbody td.comment-cell {
    white-space: pre-line;
    min-width: 260px;
    font-size: 13px;
    line-height: 1.3;
  }
  #status.error { color: #b00020; font-weight: bold; }
  .table-wrap { overflow: auto; max-height: calc(100vh - 90px); margin: 0 16px 16px; border: 1px solid #ccc; }
  table { border-collapse: collapse; font-size: 12px; white-space: nowrap; table-layout: fixed; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; overflow: hidden; text-overflow: ellipsis; }
  thead th { position: sticky; top: 0; background: #2b2f38; color: #fff; z-index: 2; }
  tbody tr:nth-child(even) { background: #fafafa; }
  tbody tr:hover { background: #eef6ff; }
  td.wrap { white-space: normal; max-width: 320px; }
  th { position: relative; }
  .col-resizer { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; user-select: none; touch-action: none; }
  .col-resizer:hover, .col-resizer.resizing { background: #5b9dd9; }
  .col-label { cursor: pointer; }
  .col-label::after { content: ''; display: inline-block; width: 10px; }
  th.sort-asc .col-label::after { content: '\25b2'; }
  th.sort-desc .col-label::after { content: '\25bc'; }
  #filterRow th { top: 27px; padding: 2px 4px; }
  #filterRow input { width: 100%; box-sizing: border-box; font-size: 12px; padding: 2px 4px; }
</style>
</head>
<body>
<header>
  <h1>OurBGG</h1>
  <div class="view-toggle">
    <label for="viewSelect">View</label>
    <select id="viewSelect" aria-label="View">
      <option value="collection" selected>Collection View</option>
      <option value="detailed">Detailed View</option>
      <option value="bgg">BGG View</option>
    </select>
  </div>
</header>
<div id="status">Loading data from collection.csv&hellip;</div>
<div class="table-wrap">
  <table id="gameTable">
    <colgroup id="colGroup"></colgroup>
    <thead>
      <tr id="headerRow"></tr>
      <tr id="filterRow"></tr>
    </thead>
    <tbody id="bodyRows"></tbody>
  </table>
</div>

<script>
// Column list mirrors every column (A-AO) of the "Games" sheet in Games.xlsx, in order.
// field = matching key in the CSV data, or null when the CSV has no equivalent data (rendered blank).
const COLUMNS = [
  { header: 'Name',           field: 'game_name' },
  { header: 'Rating',         field: 'average_rating' },
  { header: 'Complex',        field: 'weight' },
  { header: 'Yr',             field: 'year_published' },
  { header: 'YrAquired',      field: null },
  { header: 'MAquired',       field: null },
  { header: 'Played?',        field: null },
  { header: 'P-',             field: 'min_players' },
  { header: 'P+',             field: 'max_players' },
  { header: 'Ages',           field: 'min_age' },
  { header: 'Tmin',           field: 'playing_time_min' },
  { header: 'Tmax',           field: 'playing_time_max' },
  { header: 'bggSTAT',        field: null },
  { header: 'bgg-ID',         field: 'bgg_id' },
  { header: 'RecG',           field: null },
  { header: 'TYPE',           field: null },
  { header: 'Category',       field: 'categories' },
  { header: 'Mechanism',      field: 'mechanics' },
  { header: 'complexrange',   field: null },
  { header: 'Min Age Range',  field: null },
  { header: 'Game_Type',      field: null },
  { header: '1',              field: null },
  { header: '5',              field: null },
  { header: '9',              field: null },
  { header: '13',             field: null },
  { header: 'category',       field: null },
  { header: '1',              field: null },
  { header: '5',              field: null },
  { header: '9',              field: null },
  { header: '13',             field: null },
  { header: '17',             field: null },
  { header: '21',             field: null },
  { header: 'mechanic',       field: null },
  { header: '1',              field: null },
  { header: '5',              field: null },
  { header: '9',              field: null },
  { header: '13',             field: null },
  { header: '17',             field: null },
  { header: '21',             field: null },
  { header: '25',             field: null }
];

const BGG_COLUMNS = [
  { header: 'Name',      field: 'game_name' },
  { header: 'Rating',    field: 'average_rating' },
  { header: 'Complex',   field: 'weight' },
  { header: 'Yr',        field: 'year_published' },
  { header: 'P-',        field: 'min_players' },
  { header: 'P+',        field: 'max_players' },
  { header: 'Ages',      field: 'min_age' },
  { header: 'Tmin',      field: 'playing_time_min' },
  { header: 'Tmax',      field: 'playing_time_max' },
  { header: 'bgg-ID',    field: 'bgg_id' },
  { header: 'Category',  field: 'categories' },
  { header: 'Mechanism', field: 'mechanics' }
];

const COLLECTION_COLUMNS = [
  { header: 'Title',        field: 'game_name' },
  { header: 'Version',      field: null },
  { header: 'Geek Rating',  field: 'bgg_rating' },
  { header: 'Your Rating',  field: 'rating' },
  { header: 'Status',       field: 'status' },
  { header: 'Your Plays',   field: 'numplays' },
  { header: 'Comment',      field: 'comment' }
];

let activeView = 'collection';
const WRAP_FIELDS = new Set(['description', 'categories', 'mechanics', 'alternate_names', 'families', 'publishers']);

function getActiveColumns() {
  if (activeView === 'bgg') return BGG_COLUMNS;
  if (activeView === 'collection') return COLLECTION_COLUMNS;
  return COLUMNS;
}

function toNumber(value) {
  if (value === null || value === undefined || value === '') return null;
  const num = Number(String(value).replace(/[^0-9.-]/g, ''));
  return Number.isFinite(num) ? num : null;
}

function parseAge(value) {
  if (value === null || value === undefined || value === '') return null;
  const match = String(value).match(/\d+/);
  return match ? Number(match[0]) : null;
}

function parseCSV(text) {
  const rows = [];
  let currentRow = [];
  let currentValue = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (char === '"') {
      if (inQuotes && text[i + 1] === '"') {
        currentValue += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
      continue;
    }

    if (char === ',' && !inQuotes) {
      currentRow.push(currentValue);
      currentValue = '';
      continue;
    }

    if ((char === '\n' || char === '\r') && !inQuotes) {
      if (char === '\r' && text[i + 1] === '\n') {
        i++;
      }
      currentRow.push(currentValue);
      if (currentRow.some(value => value !== '')) {
        rows.push(currentRow);
      }
      currentRow = [];
      currentValue = '';
      continue;
    }

    currentValue += char;
  }

  if (currentValue.length > 0 || currentRow.length > 0) {
    currentRow.push(currentValue);
    if (currentRow.some(value => value !== '')) {
      rows.push(currentRow);
    }
  }

  if (rows.length === 0) return [];

  const [header, ...dataRows] = rows;
  return dataRows.map(row => {
    const entry = {};
    header.forEach((key, index) => {
      const value = row[index] ?? '';
      entry[key.trim()] = value.trim();
    });
    return entry;
  });
}

function getStatus(row) {
  if (row.own === '1') return 'Owned';
  if (row.prevowned === '1') return 'Prev. Owned';
  if (row.wanttoplay === '1') return 'Want to Play';
  if (row.want === '1') return 'Want';
  if (row.wishlist === '1') return 'Wishlist';
  if (row.fortrade === '1') return 'For Trade';
  return '';
}

function normalizeCsvRow(row) {
  const status = getStatus(row);
  const comment = row.comment || row.privatecomment || '';
  return {
    game_name: row.objectname || row.originalname || '',
    average_rating: toNumber(row.average),
    weight: toNumber(row.avgweight),
    year_published: toNumber(row.yearpublished),
    min_players: toNumber(row.minplayers),
    max_players: toNumber(row.maxplayers),
    min_age: parseAge(row.bggrecagerange),
    playing_time_min: toNumber(row.minplaytime),
    playing_time_max: toNumber(row.maxplaytime),
    bgg_id: toNumber(row.objectid),
    bgg_rating: toNumber(row.baverage),
    rating: toNumber(row.rating),
    numplays: toNumber(row.numplays),
    status,
    comment,
    categories: '',
    mechanics: '',
    description: ''
  };
}

function buildColGroup(columns = getActiveColumns()) {
  const colGroup = document.getElementById('colGroup');
  colGroup.innerHTML = '';
  const frag = document.createDocumentFragment();
  columns.forEach(() => {
    const col = document.createElement('col');
    col.style.width = '120px';
    frag.appendChild(col);
  });
  colGroup.appendChild(frag);
  updateTableWidth();
}

// Chrome only honors <col> widths under table-layout:fixed when the table itself has
// an explicit (non-auto) width, so keep the table's width in sync with the column sum.
function updateTableWidth() {
  const colGroup = document.getElementById('colGroup');
  const total = Array.from(colGroup.children)
    .reduce((sum, col) => sum + parseFloat(col.style.width || '120'), 0);
  document.querySelector('table').style.width = total + 'px';
}

function buildHeader() {
  const columns = getActiveColumns();
  buildColGroup(columns);
  const row = document.getElementById('headerRow');
  row.innerHTML = '';
  const frag = document.createDocumentFragment();
  columns.forEach((col, index) => {
    const th = document.createElement('th');
    th.dataset.colIndex = index;
    const label = document.createElement('span');
    label.className = 'col-label';
    label.textContent = col.header;
    label.addEventListener('click', () => sortByColumn(index));
    th.appendChild(label);
    const resizer = document.createElement('div');
    resizer.className = 'col-resizer';
    th.appendChild(resizer);
    frag.appendChild(th);
  });
  row.appendChild(frag);
  enableColumnResize(row);
  buildFilterRow();
}

let allGames = [];
const sortState = { colIndex: null, dir: 1 };
const filters = {};

function buildFilterRow() {
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  const columns = getActiveColumns();
  const frag = document.createDocumentFragment();
  columns.forEach((col, index) => {
    const th = document.createElement('th');
    if (col.field) {
      const input = document.createElement('input');
      input.placeholder = 'Filter…';
      input.addEventListener('input', () => {
        filters[index] = input.value.trim().toLowerCase();
        render();
      });
      th.appendChild(input);
    }
    frag.appendChild(th);
  });
  row.appendChild(frag);
}

function sortByColumn(colIndex) {
  const columns = getActiveColumns();
  const col = columns[colIndex];
  if (!col.field) return;
  sortState.dir = sortState.colIndex === colIndex ? -sortState.dir : 1;
  sortState.colIndex = colIndex;

  document.querySelectorAll('#headerRow th').forEach(th => th.classList.remove('sort-asc', 'sort-desc'));
  const th = document.querySelector(`#headerRow th[data-col-index="${colIndex}"]`);
  if (th) th.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');

  render();
}

function render() {
  const columns = getActiveColumns();
  let games = allGames.filter(game => {
    return Object.entries(filters).every(([colIndex, value]) => {
      if (!value) return true;
      const field = columns[Number(colIndex)]?.field;
      if (!field) return true;
      const cell = game[field];
      return cell !== null && cell !== undefined && String(cell).toLowerCase().includes(value);
    });
  });

  if (sortState.colIndex !== null && columns[sortState.colIndex]) {
    const col = columns[sortState.colIndex];
    games = [...games].sort((a, b) => {
      const av = a[col.field];
      const bv = b[col.field];
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortState.dir;
      return String(av).localeCompare(String(bv)) * sortState.dir;
    });
  }

  document.getElementById('bodyRows').innerHTML = '';
  buildRows(games);
  document.getElementById('status').textContent = `Showing ${games.length} of ${allGames.length} games`;
}

function enableColumnResize(headerRow) {
  headerRow.querySelectorAll('.col-resizer').forEach(resizer => {
    const th = resizer.parentElement;
    const colIndex = Number(th.dataset.colIndex);
    resizer.addEventListener('mousedown', e => {
      e.preventDefault();
      const col = document.getElementById('colGroup').children[colIndex];
      const startX = e.pageX;
      const startWidth = th.getBoundingClientRect().width;
      resizer.classList.add('resizing');
      function onMouseMove(ev) {
        const newWidth = Math.max(40, startWidth + (ev.pageX - startX));
        col.style.width = newWidth + 'px';
        updateTableWidth();
      }
      function onMouseUp() {
        resizer.classList.remove('resizing');
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  });
}

function buildRows(games) {
  const tbody = document.getElementById('bodyRows');
  const columns = getActiveColumns();
  const gameTable = document.getElementById('gameTable');
  gameTable.classList.toggle('view-collection-table', activeView === 'collection');
  const frag = document.createDocumentFragment();
  games.forEach(game => {
    const tr = document.createElement('tr');
    columns.forEach(col => {
      const td = document.createElement('td');
      if (col.field && game[col.field] !== undefined && game[col.field] !== null) {
        const value = game[col.field];
        if (activeView === 'collection' && col.field === 'game_name') {
          td.classList.add('title-cell');
          td.textContent = value;
        } else if (activeView === 'collection' && col.field === 'bgg_rating') {
          td.classList.add('rating-cell');
          td.textContent = value === null ? 'N/A' : value;
        } else if (activeView === 'collection' && col.field === 'rating') {
          td.classList.add('rating-cell');
          td.textContent = value === null ? 'N/A' : value;
        } else if (activeView === 'collection' && col.field === 'status') {
          td.classList.add('status-cell');
          if (value === 'Owned') td.classList.add('owned');
          if (value === 'Prev. Owned') td.classList.add('prev-owned');
          td.textContent = value;
        } else if (activeView === 'collection' && col.field === 'numplays') {
          td.classList.add('plays-cell');
          td.textContent = value === null ? '' : value;
        } else if (activeView === 'collection' && col.field === 'comment') {
          td.classList.add('comment-cell');
          td.textContent = value || '';
        } else {
          td.textContent = value;
          if (WRAP_FIELDS.has(col.field)) td.classList.add('wrap');
        }
      }
      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
}

function changeView(nextView) {
  activeView = nextView;
  Object.keys(filters).forEach(key => delete filters[key]);
  sortState.colIndex = null;
  sortState.dir = 1;
  document.querySelectorAll('#headerRow th').forEach(th => th.classList.remove('sort-asc', 'sort-desc'));
  buildHeader();
  render();
}

function loadData() {
  const status = document.getElementById('status');
  fetch('collection.csv')
    .then(response => {
      if (!response.ok) {
        throw new Error('collection.csv could not be loaded (HTTP ' + response.status + ')');
      }
      return response.text();
    })
    .then(csvText => {
      const rows = parseCSV(csvText);
      if (!rows.length) {
        throw new Error('collection.csv is empty or invalid.');
      }
      allGames = rows.map(normalizeCsvRow);
      buildHeader();
      const viewSelect = document.getElementById('viewSelect');
      viewSelect.addEventListener('change', (event) => {
        changeView(event.target.value);
      });
      render();
    })
    .catch(err => {
      status.classList.add('error');
      status.textContent = 'Failed to load data: ' + err.message;
    });
}

loadData();
</script>
</body>
</html>
